name: Build macOS app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.13.14"
  SING_BOX_SHA256: "ed19e1e7abe1517c6dc898cf31e70d237fd97e71ae6e26ccd8d2ab26e6702f8e"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Catalina-compatible sing-box core
        shell: bash
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-darwin-amd64-legacy-macos-10.13.tar.gz"
          base="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" "$base/$archive"
          echo "$SING_BOX_SHA256  $archive" | shasum -a 256 --check
          curl --fail --location --silent --show-error --retry 3 --output .sing-box-license "https://raw.githubusercontent.com/SagerNet/sing-box/v${SING_BOX_VERSION}/LICENSE"
          mkdir -p .core
          tar -xzf "$archive" -C .core
          core_path="$(find .core -type f -name sing-box | head -n 1)"
          test -n "$core_path"
          chmod 755 "$core_path"
          echo "CORE_PATH=$core_path" >> "$GITHUB_ENV"

      - name: Validate VPN engine configuration
        shell: bash
        run: |
          set -euo pipefail
          "$CORE_PATH" check -c Tests/Fixtures/sing-box.json
          "$CORE_PATH" check -c Tests/Fixtures/sing-box-hysteria2.json
          "$CORE_PATH" check -c Tests/Fixtures/sing-box-auto.json
          "$CORE_PATH" check -c Tests/Fixtures/sing-box-hysteria-v1.json
          "$CORE_PATH" check -c Tests/Fixtures/sing-box-chain.json

      - name: Build, test and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]] && [[ -f VERSION ]]; then
            app_version="$(tr -d '[:space:]' < VERSION)"
          else
            app_version="0.1.${GITHUB_RUN_NUMBER}"
          fi
          build_log="$RUNNER_TEMP/maosvpn-package.log"
          set +e
          APP_VERSION="$app_version" \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            bash Scripts/package.sh "$CORE_PATH" .sing-box-license 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ $build_status -ne 0 ]]; then
            while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//$'\n'/'%0A'}"
              echo "::error title=macOS build failed::$escaped"
            done < <(grep -E '(^|:)[0-9]+:[0-9]+: error:|(^| )error:' "$build_log" | tail -n 20 || true)
            exit "$build_status"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaosVPN-macOS-10.15-Intel
          path: |
            dist/MaosVPN-macOS-10.15-Intel.zip
            dist/MaosVPN-macOS-10.15-Intel.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate release description
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="v$(tr -d '[:space:]' < VERSION)"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<'RELEASE_NOTES'
          Maos VPN is a lightweight, open-source VPN subscription client created for older Intel Macs that cannot run clients requiring macOS 12 or newer.

          > Native AppKit interface, complete-device TUN routing, and a bundled Catalina-compatible `sing-box` core.

          ## 🇬🇧 English

          ### Highlights

          - New glossy blue Maos VPN icon, correctly sized for Dock, Finder, and documentation
          - Polished macOS-style dashboard with server search, a dotted world map, connection glow, and server/protocol cards
          - Import servers from a subscription URL in one click
          - Multiple named, collapsible subscription groups and direct JSON import
          - VLESS, VMess, Trojan, Shadowsocks, and Hysteria2 profiles
          - Base64, plain-text, and sing-box JSON subscriptions
          - TCP, WebSocket, gRPC, HTTPUpgrade, TLS, and Reality support
          - Full-device VPN routing for browsers and applications
          - Native macOS interface that follows the system light or dark appearance
          - Visible automatic server using sing-box URLTest with 30-second checks and seamless route selection
          - Manual subscription refresh and deletion without re-adding subscription URLs
          - TCP port latency checks and a wider sidebar
          - Large circular connection control with a live session timer
          - English and Russian languages with live switching
          - Profiles stored locally, with no analytics or tracking
          - Automatic update alerts at launch and checksum-verified installation

          ### Requirements

          - **macOS Catalina 10.15 or newer**
          - **Intel (`x86_64`) Mac**
          - A compatible active subscription URL

          ### Installation

          1. Download **`MaosVPN-macOS-10.15-Intel.dmg`** below.
          2. Open the DMG and drag **Maos VPN.app** into **Applications**.
          3. On first launch, right-click the app and choose **Open**.
          4. Paste your subscription URL, load the servers, select one, and connect.
          5. Approve the one-time macOS administrator prompt required to install the VPN helper.

          The public build uses ad-hoc signing, so macOS may ask for additional confirmation on the first launch. The administrator password is handled by macOS and is never received or stored by Maos VPN. Routine connections and disconnections do not ask for it again.

          ---

          ## 🇷🇺 Русский

          Maos VPN — лёгкий open-source клиент подписок для старых Intel Mac, на которые нельзя установить VPN-клиенты с требованием macOS 12 и новее.

          ### Возможности

          - Обновлённый интерфейс в стиле macOS с поиском серверов, точечной картой мира, подсветкой подключения и карточками сервера/протокола
          - Импорт серверов по ссылке подписки
          - Несколько именованных раскрывающихся групп подписок и импорт JSON
          - Профили VLESS, VMess, Trojan, Shadowsocks и Hysteria2
          - Подписки Base64, обычным текстом и в формате sing-box JSON
          - Поддержка TCP, WebSocket, gRPC, HTTPUpgrade, TLS и Reality
          - Системный TUN-режим для браузеров и приложений
          - Нативный интерфейс в системной светлой или тёмной теме macOS
          - Отдельный сервер «Автовыбор» с проверкой маршрутов каждые 30 секунд
          - Обновление и удаление подписок без повторного добавления
          - Проверка доступности TCP-портов и более широкая боковая панель
          - Большая круглая кнопка подключения с таймером сеанса
          - Русский и английский языки с переключением без перезапуска
          - Локальное хранение профилей, без аналитики и отслеживания
          - Автоматическое уведомление при запуске и установка обновлений с проверкой SHA-256

          ### Требования

          - **macOS Catalina 10.15 или новее**
          - **Mac с процессором Intel (`x86_64`)**
          - Активная совместимая ссылка подписки

          ### Установка

          1. Скачайте **`MaosVPN-macOS-10.15-Intel.dmg`** ниже.
          2. Откройте DMG и перетащите **Maos VPN.app** в папку **Программы**.
          3. При первом запуске нажмите приложение правой кнопкой и выберите **Открыть**.
          4. Вставьте ссылку подписки, загрузите серверы, выберите сервер и подключитесь.
          5. Один раз подтвердите системный запрос администратора для установки служебного VPN-helper.

          Публичная сборка подписана ad-hoc, поэтому при первом запуске macOS может запросить дополнительное подтверждение. Пароль администратора обрабатывается самой macOS — приложение его не получает и не сохраняет. Обычное подключение и отключение больше не запрашивают пароль.

          ---

          ## Downloads / Загрузки

          - **DMG** — recommended installer / рекомендуемый установщик
          - **ZIP** — portable app archive / архив приложения
          - **SHA256SUMS.txt** — checksums for file verification / контрольные суммы

          > Keep subscription URLs private: they usually contain credentials. Do not publish them in issues, screenshots, or logs.
          >
          > Храните ссылки подписки в секрете: обычно они содержат данные доступа. Не публикуйте их в Issues, скриншотах или логах.

          Built and tested automatically with GitHub Actions. Powered by the bundled open-source `sing-box` engine.
          RELEASE_NOTES

          generated_notes="$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body')"

          if [[ -n "$generated_notes" ]]; then
            printf '\n\n---\n\n## Changes in %s\n\n%s\n' \
              "$release_tag" "$generated_notes" >> "$notes_file"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="v$(tr -d '[:space:]' < VERSION)"
            # Do not publish unrelated later commits under an existing version.
            if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "Release $release_tag already exists; skipping."
              exit 0
            fi
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" \
              dist/MaosVPN-macOS-10.15-Intel.zip \
              dist/MaosVPN-macOS-10.15-Intel.dmg \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$release_tag" \
              --title "Maos VPN $release_tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          else
            gh release create "$release_tag" \
              dist/MaosVPN-macOS-10.15-Intel.zip \
              dist/MaosVPN-macOS-10.15-Intel.dmg \
              dist/SHA256SUMS.txt \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Maos VPN $release_tag"
          fi
